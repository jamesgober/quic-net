# =============================================================================
#  R E P S   ·   quic-net
# =============================================================================
[package]
name    = "quic-net"
version = "0.4.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "QUIC transport for Rust over the UDP socket of net-io: connections, streams, loss recovery, and congestion control, with TLS 1.3 through tls-net. The base for HTTP/3."

# Keywords (5 max)
keywords = ["quic", "udp", "transport", "http3", "network"]

# Categories
categories = ["network-programming"]

# Fuzz targets stay out of the package.
exclude = ["fuzz/", ".github/"]

# Links
homepage      = "https://github.com/jamesgober/quic-net"
repository    = "https://github.com/jamesgober/quic-net"
documentation = "https://docs.rs/quic-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lib]
name = "quic_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# Keyed BLAKE3 for stateless reset tokens and HMAC-SHA256 for the Initial
# key schedule (crypt-io is the one exception to the no-third-party rule:
# audited cryptography).
crypt-io = { version = "1.6", default-features = false, features = ["std", "mac-blake3", "mac-hmac"] }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Ciphers for the RFC 9001 test vectors only: the library takes its keys
# through traits. These are the versions crypt-io already brings in.
aes = "0.8.4"
aes-gcm = "0.10.3"
chacha20 = "0.9.1"
chacha20poly1305 = "0.10.1"


[[bench]]
name = "codec"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
