# =============================================================================
#  R E P S   ·   quic-net
# =============================================================================
[package]
name    = "quic-net"
version = "0.1.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "QUIC transport for Rust over the UDP socket of net-io: connections, streams, loss recovery, and congestion control, with TLS 1.3 through tls-net. The base for HTTP/3."

# Keywords (5 max)
keywords = ["quic", "udp", "transport", "http3", "network"]

# Categories
categories = ["network-programming"]

# Links
homepage      = "https://github.com/jamesgober/quic-net"
repository    = "https://github.com/jamesgober/quic-net"
documentation = "https://docs.rs/quic-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "quic_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = []


# DEPENDENCIES
# #################################
[dependencies]
# None yet. Planned dependencies and the reason for each are listed in
# dev/PLAN.md; each is added with the first code that needs it.


# DEV DEPENDENCIES
# #################################
[dev-dependencies]


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
