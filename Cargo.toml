# =============================================================================
#  R E P S   ·   quic-net
# =============================================================================
[package]
name    = "quic-net"
version = "0.7.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "QUIC transport for Rust over the UDP socket of net-io: connections, streams, loss recovery, and congestion control, with TLS 1.3 through tls-net. The base for HTTP/3."

# Keywords (5 max)
keywords = ["quic", "udp", "transport", "http3", "network"]

# Categories
categories = ["network-programming"]

# Fuzz targets stay out of the package.
exclude = ["fuzz/", ".github/"]

# Links
homepage      = "https://github.com/jamesgober/quic-net"
repository    = "https://github.com/jamesgober/quic-net"
documentation = "https://docs.rs/quic-net"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
# cargo-fuzz builds with `--cfg fuzzing`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lib]
name = "quic_net"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["tls"]
# The connection and its handshake, through tls-net with the ring provider
# and the Mozilla roots. Without it the crate is the sans-IO wire layer,
# packet protection over key traits, streams, and address validation.
tls = ["dep:tls-net", "dep:mod-rand"]


# DEPENDENCIES
# #################################
[dependencies]
# Keyed BLAKE3 for stateless reset tokens, HMAC-SHA256 for the Initial key
# schedule, and XChaCha20-Poly1305 for address validation tokens (crypt-io
# is the one exception to the no-third-party rule: audited cryptography).
crypt-io = { version = "1.6", default-features = false, features = ["std", "mac-blake3", "mac-hmac", "aead-chacha20"] }
# The TLS 1.3 handshake and the packet keys it produces (tls-net's QUIC
# interface, 0.11). rustls lives behind it, tls-net's one exception.
tls-net = { version = "0.11", default-features = false, features = ["quic", "ring", "webpki-roots"], optional = true }
# The operating system's random source, for path challenges and the
# connection IDs a connection issues (crypt-io already brings it in).
mod-rand = { version = "1.1", default-features = false, features = ["tier3"], optional = true }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
# Ciphers for the RFC 9001 test vectors only: the library takes its keys
# through traits. These are the versions crypt-io already brings in.
aes = "0.8.4"
aes-gcm = "0.10.3"
chacha20 = "0.9.1"
chacha20poly1305 = "0.10.1"


[[bench]]
name = "codec"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
